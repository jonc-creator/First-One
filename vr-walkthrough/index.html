<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Coach House VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: full-bleed 3D stage, one HUD card top-left, a VR button bottom-center. Dark chrome over the render. */
:root{
  --bg:#1f2a36; --fg:#f3f1ec; --muted:#b8c0c9; --card:rgba(31,42,54,.88); --line:rgba(243,241,236,.16);
  --accent:#e9b872; --accent-ink:#1f2a36;
  --font:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15202b; --fg:#f3f1ec; --muted:#aeb7c1; --card:rgba(21,32,43,.9); --line:rgba(243,241,236,.16); --accent:#e9b872; --accent-ink:#15202b; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#15202b; --fg:#f3f1ec; --muted:#aeb7c1; --card:rgba(21,32,43,.9); --line:rgba(243,241,236,.16); --accent:#e9b872; --accent-ink:#15202b; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:fixed;inset:0;background:#cfe0ee}
#stage canvas{display:block;touch-action:none;outline:none}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(360px,calc(100vw - 32px));background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.hud h1{margin:0;font-size:20px;font-weight:800;line-height:1.15;text-wrap:balance}
.hud h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.hud p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.hud p b{color:var(--fg);font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.jump button{font:inherit;font-size:12px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:5px 9px;cursor:pointer}
.jump button:hover,.jump button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#xrnote{color:var(--accent)}

/* three.js VRButton restyled */
#VRButton{font-family:var(--font) !important;font-weight:800 !important;font-size:13px !important;letter-spacing:.08em !important;
  background:var(--accent) !important;color:var(--accent-ink) !important;border:0 !important;border-radius:6px !important;
  padding:12px 22px !important;opacity:1 !important;width:auto !important;left:50% !important;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 22px) !important;z-index:6 !important;text-decoration:none !important}
#VRButton:disabled{background:var(--card) !important;color:var(--muted) !important;border:1px solid var(--line) !important}

@media (max-width:480px){ .hud{padding:10px 12px} .hud h1{font-size:17px} .hud p.ctl{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div id="stage"></div>

<div class="hud">
  <div class="brand">Weatherall Builders · VR prototype</div>
  <h1>The Coach House <small>Great room, kitchen and entry · 2965 Travis Ave</small></h1>
  <p class="ctl"><b>Desktop:</b> drag to look, W A S D or arrows to walk, click the floor to jump there. <b>Headset:</b> trigger on the floor to teleport, right stick to turn, left stick to walk.</p>
  <div class="jump" aria-label="Jump to">
    <button type="button" data-jump="entry">Front door</button>
    <button type="button" data-jump="living">Living</button>
    <button type="button" data-jump="dining">Dining</button>
    <button type="button" data-jump="kitchen">Kitchen</button>
  </div>
  <p id="xrnote" hidden></p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ units + plan
   Plan feet from the construction documents (sheets A2/A3), origin at the
   kitchen's rear-left corner. X runs across the house, Z runs toward the front.
   Room sizes are approximate; the drawings govern. */
const FT = 0.3048, IN = 0.0254;
const ft = v => v * FT, inch = v => v * IN;
const W = 13, D = 39;                                   // great room: kitchen 0-12, dining 12-22.5, living 22.5-39
const ENTRY = { x0: 13, x1: 17, z0: 18.4, z1: 39 };
const WALL_H = 9, RIDGE_H = 12.5, VAULT_Z0 = 12, T = 4.5 / 12;   // vault over dining + living

// Jump spots (plan feet, yaw in radians; 0 faces the rear/kitchen)
const SPOTS = {
  entry:   { x: 15.0, z: 36.5, yaw:  0.5  },
  living:  { x: 6.5,  z: 33.0, yaw:  0.1  },
  dining:  { x: 6.5,  z: 19.0, yaw:  0.0  },
  kitchen: { x: 7.5,  z: 11.0, yaw:  0.0  },
};

/* ------------------------------------------------------------------ renderer */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ee);
scene.fog = new THREE.Fog(0xcfe0ee, 40, 120);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);
const rig = new THREE.Group();            // the person: moves and turns; the camera rides inside
rig.add(camera);
scene.add(rig);
camera.position.set(0, 1.62, 0);          // desktop eye height; the headset overrides this

/* ------------------------------------------------------------------ textures (procedural, tileable) */
function rngf(seed) { let s = (seed >>> 0) || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function noiseField(size, seed, octaves = 4, base = 8) {
  const out = new Float32Array(size * size), rnd = rngf(seed); let amp = 1, tot = 0;
  for (let o = 0; o < octaves; o++) {
    const n = base << o, lat = new Float32Array(n * n); for (let i = 0; i < lat.length; i++) lat[i] = rnd();
    const cell = size / n;
    for (let y = 0; y < size; y++) {
      const gy = y / cell, y0 = Math.floor(gy) % n, fy = gy - Math.floor(gy), y1 = (y0 + 1) % n, sy = fy * fy * (3 - 2 * fy);
      for (let x = 0; x < size; x++) {
        const gx = x / cell, x0 = Math.floor(gx) % n, fx = gx - Math.floor(gx), x1 = (x0 + 1) % n, sx = fx * fx * (3 - 2 * fx);
        const a = lat[y0 * n + x0], b = lat[y0 * n + x1], c = lat[y1 * n + x0], d = lat[y1 * n + x1];
        const top = a + (b - a) * sx, bot = c + (d - c) * sx;
        out[y * size + x] += amp * (top + (bot - top) * sy);
      }
    }
    tot += amp; amp *= .5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}
function canvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function fieldCanvas(size, f, fn) {
  const c = canvas(size), g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for (let i = 0; i < size * size; i++) { const [r, gg, b] = fn(f[i], i); d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}
// tex(canvas, metersCovered): repeat makes 1 UV unit = 1 meter, matching the meter-scaled geometry below
function tex(c, metersW, metersH = metersW, color = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / metersW, 1 / metersH);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t;
}

// Skip-trowel white walls
const wallF = noiseField(512, 11, 5, 6), wallF2 = noiseField(512, 23, 3, 24);
const wallMap = tex(fieldCanvas(512, wallF, (v, i) => { const k = 238 + (v - .5) * 14 + (wallF2[i] - .5) * 6; return [k + 1, k - 1, k - 5]; }), 1.5);
const wallBump = tex(fieldCanvas(512, wallF, (v, i) => { const k = 128 + (v - .5) * 110 + (wallF2[i] - .5) * 60; return [k, k, k]; }), 1.5, 1.5, false);

// Weathered medium-brown LVP planks, 7" x 48", staggered. Canvas covers 4 ft x 4 ft.
function plankCanvas() {
  const S = 1024, c = canvas(S), g = c.getContext('2d'), rnd = rngf(5), grain = noiseField(256, 9, 4, 4);
  const pw = S / 4 * (48 / 12), ph = S / 4 * (7 / 12);
  const base = [[138, 106, 78], [128, 98, 72], [150, 118, 88], [120, 92, 68], [142, 112, 84]];
  for (let row = -1; row * ph < S + ph; row++) {
    const off = (((row % 3) + 3) % 3) * pw / 3;
    for (let col = -1; col * pw - off < S + pw; col++) {
      const x = col * pw - off, y = row * ph, b = base[(((row * 7 + col * 13) % base.length) + base.length) % base.length];
      const dk = .92 + rnd() * .16;
      g.fillStyle = `rgb(${b[0] * dk | 0},${b[1] * dk | 0},${b[2] * dk | 0})`; g.fillRect(x, y, pw, ph);
      for (let k = 0; k < 26; k++) {
        const gy = y + rnd() * ph, a = .05 + rnd() * .12, len = pw * (.3 + rnd() * .7), gx = x + rnd() * pw;
        g.strokeStyle = `rgba(${rnd() > .5 ? '60,40,25' : '200,170,135'},${a})`; g.lineWidth = .6 + rnd() * 1.4;
        g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + len, gy + (rnd() - .5) * 3); g.stroke();
      }
      g.fillStyle = 'rgba(40,26,16,.55)'; g.fillRect(x, y, pw, 1.5); g.fillRect(x, y, 1.5, ph);
      g.fillStyle = 'rgba(255,240,220,.18)'; g.fillRect(x, y + ph - 1, pw, 1);
    }
  }
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < S * S; i++) { const v = (grain[((i / S | 0) >> 2) * 256 + ((i % S) >> 2)] - .5) * 22; d[i * 4] += v; d[i * 4 + 1] += v; d[i * 4 + 2] += v; }
  g.putImageData(img, 0, 0); return c;
}
const floorMap = tex(plankCanvas(), ft(4));

// White quartz with faint gray veins (1 m tile)
const qF = noiseField(512, 31, 5, 3);
const quartzMap = tex(fieldCanvas(512, qF, v => { const vein = Math.abs(v - .55) < .012 ? 22 : 0; const k = 243 - vein + (v - .5) * 6; return [k, k, k - 2]; }), 1);

// 3x6 white subway tile, running bond, gray grout. Canvas covers 12" x 6".
function subwayCanvas() {
  const Wc = 512, Hc = 256, c = canvas(Wc, Hc), g = c.getContext('2d'), tw = Wc / 2, th = Hc / 2, grout = 5;
  g.fillStyle = '#b9b7b1'; g.fillRect(0, 0, Wc, Hc);
  for (let r = 0; r < 2; r++) for (let i = -1; i <= 2; i++) {
    const x = i * tw + (r ? tw / 2 : 0), y = r * th;
    const gr = g.createLinearGradient(x, y, x + tw, y + th); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#f1f1ee');
    g.fillStyle = gr; g.fillRect(x + grout / 2, y + grout / 2, tw - grout, th - grout);
  }
  return c;
}
const subwayC = subwayCanvas();
const subwayMap = tex(subwayC, inch(12), inch(6));
const subwayBump = (() => { const c = canvas(512, 256); c.getContext('2d').drawImage(subwayC, 0, 0); return tex(c, inch(12), inch(6), false); })();

// Stained shaker door / drawer fronts: one canvas per size, cached
const doorCache = new Map();
function shakerTex(wIn, hIn) {
  const key = `${wIn.toFixed(1)}x${hIn.toFixed(1)}`; if (doorCache.has(key)) return doorCache.get(key);
  const px = 14, Wc = Math.max(8, Math.round(wIn * px)), Hc = Math.max(8, Math.round(hIn * px)), c = canvas(Wc, Hc), g = c.getContext('2d'), rnd = rngf(Wc * 31 + Hc);
  const stain = (dk = 1) => `rgb(${122 * dk | 0},${84 * dk | 0},${54 * dk | 0})`;
  g.fillStyle = stain(); g.fillRect(0, 0, Wc, Hc);
  const grainLines = (x, y, w, h, vertical) => {
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
    for (let k = 0; k < (vertical ? w : h) * .9; k++) {
      const a = .06 + rnd() * .14; g.strokeStyle = `rgba(${rnd() > .5 ? '50,30,15' : '190,140,95'},${a})`; g.lineWidth = .5 + rnd();
      g.beginPath();
      if (vertical) { const gx = x + rnd() * w; g.moveTo(gx, y); g.lineTo(gx + (rnd() - .5) * 3, y + h); }
      else { const gy = y + rnd() * h; g.moveTo(x, gy); g.lineTo(x + w, gy + (rnd() - .5) * 3); }
      g.stroke();
    }
    g.restore();
  };
  const rail = Math.min(2.25 * px, Wc * .32, Hc * .32);
  grainLines(0, 0, rail, Hc, true); grainLines(Wc - rail, 0, rail, Hc, true);
  grainLines(rail, 0, Wc - 2 * rail, rail, false); grainLines(rail, Hc - rail, Wc - 2 * rail, rail, false);
  g.fillStyle = stain(.9); g.fillRect(rail, rail, Wc - 2 * rail, Hc - 2 * rail);
  grainLines(rail, rail, Wc - 2 * rail, Hc - 2 * rail, true);
  g.fillStyle = 'rgba(0,0,0,.38)'; g.fillRect(rail, rail, Wc - 2 * rail, 3); g.fillRect(rail, rail, 3, Hc - 2 * rail);
  g.fillStyle = 'rgba(255,230,200,.16)'; g.fillRect(rail, Hc - rail - 2, Wc - 2 * rail, 2); g.fillRect(Wc - rail - 2, rail, 2, Hc - 2 * rail);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2; g.strokeRect(1, 1, Wc - 2, Hc - 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  doorCache.set(key, t); return t;
}

/* ------------------------------------------------------------------ materials */
const std = o => new THREE.MeshStandardMaterial(o);
const M = {
  wall:      std({ map: wallMap, bumpMap: wallBump, bumpScale: .012, roughness: .92, envMapIntensity: .25 }),
  ceiling:   std({ color: 0xf6f4f0, roughness: 1, envMapIntensity: .2 }),
  floor:     std({ map: floorMap, roughness: .5, metalness: 0, envMapIntensity: .45 }),
  trim:      std({ color: 0xfafaf7, roughness: .38, envMapIntensity: .5 }),
  door:      std({ color: 0xf7f7f4, roughness: .42, envMapIntensity: .5 }),
  frontDoor: std({ color: 0x2b3a4a, roughness: .45, envMapIntensity: .5 }),
  glass:     new THREE.MeshPhysicalMaterial({ color: 0xdfeefb, transparent: true, opacity: .22, roughness: .05, metalness: 0, envMapIntensity: 1.2, side: THREE.DoubleSide, depthWrite: false }),
  cabBox:    std({ color: 0x5b3e28, roughness: .6, envMapIntensity: .3 }),
  quartz:    std({ map: quartzMap, roughness: .14, envMapIntensity: 1 }),
  subway:    std({ map: subwayMap, bumpMap: subwayBump, bumpScale: -.02, roughness: .28, envMapIntensity: .9 }),
  pull:      std({ color: 0x141414, roughness: .35, metalness: .65 }),
  steel:     std({ color: 0xcfd2d4, roughness: .32, metalness: .85, envMapIntensity: 1.1 }),
  black:     std({ color: 0x1a1a1a, roughness: .5, metalness: .2 }),
  kick:      std({ color: 0x2a2018, roughness: .9 }),
  ground:    std({ color: 0x8c9a6e, roughness: 1 }),
  concrete:  std({ color: 0xb8b4ac, roughness: .95 }),
};

/* ------------------------------------------------------------------ geometry helpers (UVs in meters so textures stay true to scale) */
function boxGeo(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let i = 0; i < uv.count; i++) { const f = Math.floor(i / 4); uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]); }
  return g;
}
const world = new THREE.Group(); scene.add(world);
function box(w, h, d, mat, x, y, z, { shadow = true } = {}) {   // x,y,z = center, meters
  const m = new THREE.Mesh(boxGeo(w, h, d), mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; world.add(m); return m;
}
// plan-feet box: xf0..xf1 across, yf0..yf1 up, zf0..zf1 toward the front
function fbox(xf0, xf1, yf0, yf1, zf0, zf1, mat, opts) {
  return box(ft(xf1 - xf0), ft(yf1 - yf0), ft(zf1 - zf0), mat, ft((xf0 + xf1) / 2), ft((yf0 + yf1) / 2), ft((zf0 + zf1) / 2), opts);
}

/* ------------------------------------------------------------------ walls with openings */
const contactCache = {};
function contactMat(axis, out) {
  // Floor strip whose gradient is dark at the wall and clear toward the room. Canvas top = v 1 = world -Z after the plane is laid flat.
  const key = axis + out.join(','); if (contactCache[key]) return contactCache[key];
  const c = canvas(64, 64), g = c.getContext('2d');
  const alongZ = axis === 'x';                                     // strip runs along Z, gradient across X
  const gr = alongZ ? g.createLinearGradient(0, 0, 64, 0) : g.createLinearGradient(0, 0, 0, 64);
  const darkStop = alongZ ? (out[0] > 0 ? 1 : 0) : (out[1] > 0 ? 1 : 0);
  gr.addColorStop(darkStop, 'rgba(0,0,0,.34)'); gr.addColorStop(1 - darkStop, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return contactCache[key] = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
}

// A wall runs from a to b (plan feet). `out` is the unit normal toward the outside. Openings: {from,to,sill,head,kind}
function wall({ a, b, out, H = WALL_H, ops = [] }) {
  const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz), ux = dx / L, uz = dz / L, alongX = Math.abs(ux) > .5;
  const place = (s0, s1, y0, y1) => {
    if (s1 - s0 <= 0.001) return;
    const cx = a[0] + ux * (s0 + s1) / 2 + out[0] * T / 2, cz = a[1] + uz * (s0 + s1) / 2 + out[1] * T / 2;
    box(alongX ? ft(s1 - s0) : ft(T), ft(y1 - y0), alongX ? ft(T) : ft(s1 - s0), M.wall, ft(cx), ft((y0 + y1) / 2), ft(cz));
  };
  const base = (s0, s1) => {   // baseboard 5.5" x 5/8" on the inside face, plus a contact shadow on the floor
    if (s1 - s0 <= 0.01) return;
    const th = 5 / 8 / 12, cx = a[0] + ux * (s0 + s1) / 2 - out[0] * th / 2, cz = a[1] + uz * (s0 + s1) / 2 - out[1] * th / 2;
    box(alongX ? ft(s1 - s0) : ft(th), inch(5.5), alongX ? ft(th) : ft(s1 - s0), M.trim, ft(cx), inch(2.75), ft(cz), { shadow: false });
    const sw = ft(10 / 12), sx = a[0] + ux * (s0 + s1) / 2 - out[0] * (5 / 12), sz = a[1] + uz * (s0 + s1) / 2 - out[1] * (5 / 12);
    const sg = new THREE.PlaneGeometry(alongX ? ft(s1 - s0) : sw, alongX ? sw : ft(s1 - s0));
    const sm = new THREE.Mesh(sg, contactMat(alongX ? 'z' : 'x', out)); sm.rotation.x = -Math.PI / 2; sm.position.set(ft(sx), .004, ft(sz)); sm.renderOrder = 1; world.add(sm);
  };
  const sorted = [...ops].sort((p, q) => p.from - q.from);
  let cur = -T;                                                    // extend into the corners
  for (const op of sorted) {
    place(cur, op.from, 0, H); base(Math.max(cur, 0), op.from);
    if (op.sill > 0) { place(op.from, op.to, 0, op.sill); base(op.from, op.to); }
    if (op.head < H) place(op.from, op.to, op.head, H);
    opening(a, ux, uz, out, op);
    cur = op.to;
  }
  place(cur, L + T, 0, H); base(Math.max(cur, 0), L);
}

// Jambs, casing, sash, glass and doors for one opening
function opening(a, ux, uz, out, op) {
  const w = op.to - op.from, h = op.head - op.sill, cw = 3.5 / 12, ct = 0.75 / 12, jt = 0.75 / 12;
  const cx = a[0] + ux * (op.from + op.to) / 2, cz = a[1] + uz * (op.from + op.to) / 2, alongX = Math.abs(ux) > .5;
  // piece(lengthAlongWall, height, thickness, mat, offsetAlongWall, centerY, outwardOffsetOfCenter)
  const piece = (len, hgt, thick, mat, s, y, off, opts) => {
    const px = cx + ux * s + out[0] * off, pz = cz + uz * s + out[1] * off;

  };

  piece(jt, h, T, M.trim, (w / 2 - jt / 2), op.sill + h / 2, T / 2);
  piece(w, jt, T, M.trim, 0, op.head - jt / 2, T / 2);
  // Craftsman flat casing on the inside: legs plus a slightly wider head
  piece(cw, h + cw, ct, M.trim, -(w / 2 + cw / 2), op.sill + h / 2 + cw / 2, -ct / 2, { shadow: false });
  piece(cw, h + cw, ct, M.trim, (w / 2 + cw / 2), op.sill + h / 2 + cw / 2, -ct / 2, { shadow: false });
  piece(w + 2 * cw + 1 / 12, cw + 0.5 / 12, ct + 0.25 / 12, M.trim, 0, op.head + (cw + 0.5 / 12) / 2, -(ct + 0.25 / 12) / 2, { shadow: false });
  if (op.kind === 'window' || op.kind === 'glassdoor') {

      piece(w + 2 * cw, 2.5 / 12, ct, M.trim, 0, op.sill - 1.25 / 12, -ct / 2, { shadow: false });      // apron

    piece(fr, h - 2 * jt, 1.5 / 12, M.trim, (w / 2 - jt - fr / 2), op.sill + h / 2, T / 2);
    piece(w - 2 * jt, fr, 1.5 / 12, M.trim, 0, op.head - jt - fr / 2, T / 2);
    piece(w - 2 * jt, fr, 1.5 / 12, M.trim, 0, op.sill + jt + fr / 2, T / 2);
    if (w > 3.5) piece(fr, h - 2 * jt, 1.5 / 12, M.trim, 0, op.sill + h / 2, T / 2);                 // center mullion
    if (op.kind === 'window') piece(w - 2 * jt, 1 / 12, 1.25 / 12, M.trim, 0, op.sill + h * .62, T / 2); // meeting rail
    const gl = piece(w - 2 * jt, h - 2 * jt, .25 / 12, M.glass, 0, op.sill + h / 2, T / 2, { shadow: false });

    const mat = op.mat || M.door;
    piece(w - 2 * jt, h - jt, 1.75 / 12, mat, 0, op.sill + (h - jt) / 2, T / 2);

  }
}

// Door and drawer fronts along one face. face 'z+' = fronts lie in a Z plane, 'x+' = in an X plane; dir = which way they face.
function fronts({ x0, x1, z0, z1, face, y0, y1, drawerTop = false, modW = 2, dir = 1 }) {

    const s0 = (alongX ? x0 : z0) + i * w + gap, s1 = s0 + w - 2 * gap;
    const parts = drawerTop ? [[y0 + gap, y0 + 6 / 12 - gap, 'drawer'], [y0 + 6 / 12 + gap, y1 - gap, 'door']] : [[y0 + gap, y1 - gap, 'door']];
    for (const [a, b, kind] of parts) {
      const mat = std({ map: shakerTex((s1 - s0) * 12, (b - a) * 12), roughness: .5, envMapIntensity: .35 });
      alongX ? fbox(s0, s1, a, b, d0, d1, mat) : fbox(d0, d1, a, b, s0, s1, mat);

        const cy = (a + b) / 2, cs = (s0 + s1) / 2;

function walkable(xf, zf) {
  const m = 0.9;
  const inRoom = xf > m && xf < W - m && zf > m && zf < D - m;
  const inEntry = xf >= W - m && xf < ENTRY.x1 - m && zf > ENTRY.z0 + m && zf < D - m;
  if (!(inRoom || inEntry)) return false;
  for (const [x0, x1, z0, z1] of blocked) if (xf > x0 - .4 && xf < x1 + .4 && zf > z0 - .4 && zf < z1 + .4) return false;
  return true;
}
const headPos = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
function headWorld() { camera.getWorldPosition(headPos); return headPos; }
function placeHead(x, z) { const h = headWorld(); rig.position.x += x - h.x; rig.position.z += z - h.z; }   // meters
function tryMove(dx, dz) {
  const h = headWorld(); const nx = h.x + dx, nz = h.z + dz;
  if (walkable(nx / FT, nz / FT)) { rig.position.x += dx; rig.position.z += dz; return; }
  if (walkable(nx / FT, h.z / FT)) { rig.position.x += dx; return; }
  if (walkable(h.x / FT, nz / FT)) { rig.position.z += dz; }
}
function turnAround(angle) {                        // rotate the rig about the head so the person stays put
  const h = headWorld().clone(); rig.rotation.y += angle;
  rig.updateMatrixWorld(true); const h2 = headWorld();
  rig.position.x += h.x - h2.x; rig.position.z += h.z - h2.z;
}
let pitch = 0;
function jumpTo(name) {

  rig.position.set(ft(s.x), 0, ft(s.z)); rig.rotation.set(0, s.yaw, 0);
  if (!renderer.xr.isPresenting) { camera.position.set(0, 1.62, 0); camera.rotation.set(0, 0, 0); pitch = 0; }
  rig.updateMatrixWorld(true);
}

const keys = new Set(), el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {

  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
  rig.rotation.y -= dx * 0.0045; pitch = THREE.MathUtils.clamp(pitch - dy * 0.0045, -1.2, 1.2); camera.rotation.x = pitch;
});
el.addEventListener('pointerup', e => {

  const hit = r.intersectObjects(floors, false)[0];

function pollGamepads(dt) {
  const session = renderer.xr.getSession(); if (!session) return;

      if (snapReady && Math.abs(ax) > .7) { turnAround(-Math.sign(ax) * Math.PI / 6); snapReady = false; }

}

    tmpV.set(0, 0, -1).applyQuaternion(c.getWorldQuaternion(tmpQ)); ray.set(c.getWorldPosition(new THREE.Vector3()), tmpV);
    const hit = ray.intersectObjects(floors, false)[0];
    if (hit && walkable(hit.point.x / FT, hit.point.z / FT)) { ring.position.copy(hit.point).y += .01; ring.visible = true; c.userData.target = hit.point.clone(); c.userData.line.scale.z = hit.distance; }
    else { c.userData.target = null; c.userData.line.scale.z = 6; }
  }
}

/* ------------------------------------------------------------------ VR button + notes */
const xrnote = document.getElementById('xrnote');
document.body.appendChild(VRButton.createButton(renderer));
(async () => {
  const framed = window.self !== window.top;
  const direct = 'Open the direct link in the Quest browser to enter VR.';
  if (!navigator.xr) { xrnote.textContent = framed ? 'VR is off inside this preview. ' + direct : 'This browser has no VR support. ' + direct; xrnote.hidden = false; return; }
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-vr');
    xrnote.textContent = ok ? 'Headset detected. Press Enter VR, then pull the trigger while pointing at the floor to teleport.' : (framed ? 'VR is blocked inside this preview frame. ' + direct : 'No headset found for this browser.');
  } catch (e) { xrnote.textContent = framed ? 'VR is blocked inside this preview frame. ' + direct : 'VR could not start here: ' + e.message; }
  xrnote.hidden = false;
})();
const resetShadow = (n) => { sun.shadow.mapSize.set(n, n); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } };
renderer.xr.addEventListener('sessionstart', () => { resetShadow(1024); jumpTo('entry'); });
renderer.xr.addEventListener('sessionend', () => { resetShadow(2048); jumpTo('entry'); });

/* ------------------------------------------------------------------ loop */
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
jumpTo('entry');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (renderer.xr.isPresenting) { pollGamepads(dt); aimTeleport(); }
  else if (keys.size) {
    const f = (keys.has('w') || keys.has('arrowup')) - (keys.has('s') || keys.has('arrowdown'));
    const s = (keys.has('d') || keys.has('arrowright')) - (keys.has('a') || keys.has('arrowleft'));
    if (f || s) {
      const sp = (keys.has('shift') ? 2.6 : 1.4) * dt, yaw = rig.rotation.y;
      tryMove((-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp);
    }
  }
  renderer.render(scene, camera);
});
</script>
